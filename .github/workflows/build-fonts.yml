name: Build CJK Font Modules

on:
  schedule:
    # 每天 03:17 UTC（避开整点高峰）
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fonts:
        description: '逗号分隔的 slug（留空=全部），如 lxgw-wenkai,sarasa-gothic'
        required: false
        default: ''

permissions:
  contents: write

# 同一时间只跑一个实例：update 作业会向 master 推送 updates/，
# 并发运行会互相覆盖或产生非快进推送。排队而非取消，避免中断已开始的构建。
concurrency:
  group: build-fonts
  cancel-in-progress: false

jobs:
  # 校验配置、过滤、查重，产出需要构建的字体矩阵（每个字体一行）
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        name: 校验配置、查重并生成构建矩阵
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER: ${{ github.event.inputs.fonts || '' }}
          # 仅定时（schedule）触发时跳过已发布版本；手动触发（workflow_dispatch）强制重建
          SKIP_PUBLISHED: ${{ github.event_name == 'schedule' }}
        run: |
          shopt -s nullglob
          files=(.github/fonts/*/config.json)

          # 校验每个配置文件的 schema；任一无效即 fail-fast（带文件名标注）
          for f in "${files[@]}"; do
            jq -e '
              (.slug | type == "string" and length > 0)
              and (.name | type == "string" and length > 0)
              and (.module_id | type == "string" and length > 0)
              and (.upstream | type == "string" and length > 0)
              and (.format == "ttf" or .format == "otf")
              and (.license.assets | type == "array" and length > 0)
              and (.download.kind == "assets" or .download.kind == "archive")
              and (.download.entries | type == "array" and length > 0)
              and ([.download.entries[] |
                     (.from | type == "string" and length > 0)
                     and (.weight | type == "number" and . >= 1 and . <= 9)] | all)
              and (if .download.kind == "archive"
                     then (.download.asset | type == "string" and length > 0)
                          and (.download.archive_format == "zip" or .download.archive_format == "7z")
                     else true end)
              and (((.cjk_langs // ["zh-Hans", "zh-Hant,zh-Bopo", "ja", "ko"]) | type == "array" and length > 0 and ([.[] | (type == "string" and length > 0)] | all)))
              and ((.fallback // "nearest") == "nearest")
            ' "$f" >/dev/null || { echo "::error file=$f::配置文件校验失败" >&2; exit 1; }
          done

          # 过滤（FONT_FILTER）+ 查重（release 已存在则不进矩阵）
          IFS=',' read -ra WANT <<< "$FILTER"
          rows=()
          for f in "${files[@]}"; do
            slug="$(jq -r .slug "$f")"

            # FONT_FILTER 精确匹配
            if [[ ${#WANT[@]} -gt 0 ]]; then
              hit=false
              for x in "${WANT[@]}"; do [[ "$x" == "$slug" ]] && hit=true; done
              [[ "$hit" == true ]] || continue
            fi

            # 查重（仅 schedule）：上游最新版本是否已发布过
            upstream="$(jq -r .upstream "$f")"
            # releases/latest 只含正式版，仅发 prerelease 的上游（如 zhuque）会 404，回退到列表第一条。
            # 注意：gh api 在 404 时把错误体写到 stdout，故用「失败即清空」而非 || true，
            # 否则 tag 会被错误体占满、回退永不触发。
            rel="$(gh api "repos/$upstream/releases/latest" 2>/dev/null)" || rel=""
            [[ -n "$(jq -r '.tag_name // empty' <<<"$rel" 2>/dev/null)" ]] \
              || rel="$(gh api "repos/$upstream/releases?per_page=1" --jq '.[0] // empty' 2>/dev/null)" || rel=""
            tag="$(jq -r '.tag_name // empty' <<<"$rel" 2>/dev/null)"
            if [[ -z "$tag" ]]; then
              echo "::error file=$f::无法获取上游 $upstream 的 release" >&2; exit 1
            fi
            if [[ "$SKIP_PUBLISHED" == "true" ]] && gh api "repos/$GITHUB_REPOSITORY/releases/tags/$slug-$tag" >/dev/null 2>&1; then
              echo "跳过（已发布）：$slug $tag"
              continue
            fi

            # 校验下载源正则能唯一匹配到上游资产（与 build_fonts.sh 的 pick_url 同一约定）。
            # 上游改名/删档在这里 fail-fast：否则矩阵照常通过，问题要到 build 阶段才暴露，
            # 且该字体因始终发不出 release 会随每个新版本每天重复失败。
            assets="$(jq -r '.assets[]?.name' <<<"$rel")"
            if [[ "$(jq -r .download.kind "$f")" == "archive" ]]; then
              patterns="$(jq -r '.download.asset' "$f")"
            else
              patterns="$(jq -r '.download.entries[].from' "$f")"
            fi
            while IFS= read -r pat; do
              cnt=0
              while IFS= read -r an; do
                [[ "$an" =~ $pat ]] && cnt=$((cnt + 1))
              done <<< "$assets"
              if (( cnt != 1 )); then
                echo "::error file=$f::下载源正则 '$pat' 匹配到 $cnt 个上游资产（应为 1），上游可能已改名或删除" >&2
                exit 1
              fi
            done <<< "$patterns"

            echo "待构建：$slug $tag"
            rows+=("$(jq -c --arg path "$f" '{slug: .slug, config: $path}' "$f")")
          done

          include="[$(IFS=','; echo "${rows[*]}")]"
          echo "矩阵：$include"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  # 每个字体一个作业，并行构建并发布；fail-fast: false 保证互不影响
  build:
    needs: matrix
    if: needs.matrix.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 p7zip（更纱黑体的 .7z 归档需要）
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - id: build
        name: 构建 ${{ matrix.slug }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PUBLISHED: ${{ github.event_name == 'schedule' }}
        run: bash .github/scripts/build_fonts.sh "${{ matrix.config }}"

      - name: 发布 ${{ matrix.slug }}
        if: steps.build.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.build.outputs.release_tag }}
          name: ${{ steps.build.outputs.title }}
          body: ${{ steps.build.outputs.notes }}
          files: dist/*.zip
          fail_on_unmatched_files: true

      # 发布成功后才上传更新清单，避免清单指向不存在的 release。
      # 该步骤失败会跳过，次日定时任务的查重会认为该字体已发布而不再重建，
      # 此时需手动触发一次该字体（SKIP_PUBLISHED=false）补齐清单。
      - name: 上传更新清单 ${{ matrix.slug }}
        if: steps.build.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-${{ matrix.slug }}
          path: dist/updates/${{ matrix.slug }}.json
          if-no-files-found: error

  # 汇总各构建作业产出的更新清单，一次性提交到 master 的 updates/，供模块内 Magisk 检查更新。
  # 每个字体一个 artifact，合并后单次提交，避免多作业并发推送 master 产生冲突。
  update:
    needs: build
    # 部分字体构建失败时仍提交成功者的清单；整批被跳过（无新版本）或运行被取消时不提交。
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/download-artifact@v8
        with:
          pattern: update-*
          path: artifacts
          merge-multiple: true

      - name: 合并并提交 updates/
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.json)
          if (( ${#files[@]} == 0 )); then
            echo "没有新的更新清单，跳过"
            exit 0
          fi
          mkdir -p updates
          cp -f "${files[@]}" updates/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates
          if git diff --cached --quiet; then
            echo "updates/ 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 Magisk 模块更新清单"
          git push origin HEAD:master
